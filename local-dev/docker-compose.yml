name: game-template-local

services:
  auth-stub:
    image: nginx:alpine
    volumes:
      - ./auth-stub/jwks.json:/usr/share/nginx/html/jwks.json:ro
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/jwks.json"]
      interval: 2s
      timeout: 2s
      retries: 30

  backend:
    build:
      context: ..
      dockerfile: local-dev/backend.Dockerfile.dev
    depends_on:
      auth-stub:
        condition: service_healthy
    environment:
      # Same URL the platform sets in a deployed pod, so the app opens the file
      # the same way here as it does there.
      DATABASE_URL: sqlite:///data/db.sqlite
      GBANDIT_ENVIRONMENT: dev
      AUTH_ISSUER: dev
      AUTH_AUDIENCE: game-backend
      AUTH_JWKS_URL: http://auth-stub/jwks.json
      RUST_LOG: replace_with_project=debug,tower_http=debug
    volumes:
      - ../backend:/app
      - game-data:/data
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/app/target
    expose:
      - "8080"

  frontend:
    build:
      context: ..
      dockerfile: local-dev/frontend.Dockerfile.dev
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  game-data:
  cargo-registry:
  cargo-target:
  frontend-node-modules:
